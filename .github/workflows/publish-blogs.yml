name: Schedule Daily Blog

on:
  schedule:
    # Every day 7:00 PM IST (13:30 UTC) — generates tomorrow's post (go-live 08:00 AM IST)
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force create another scheduled post even if one was already logged today"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Generate and schedule B2B blog
        run: node scripts/generate-and-publish.js
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
          GROQ_FALLBACK_MODEL: llama-3.1-8b-instant
          GROQ_CALL_DELAY_SEC: "15"
          GROQ_PART_DELAY_SEC: "25"
          GROQ_FALLBACK_PART_DELAY_SEC: "8"
          GROQ_MAX_429_WAIT_SEC: "60"
          GROQ_ABSOLUTE_MIN_WORDS: "1400"
          GROQ_META_MAX_TOKENS: "3500"
          GROQ_PART_MAX_TOKENS: "4000"
          GROQ_MAX_TOKENS: "4500"
          BLOG_API_SECRET: ${{ secrets.BLOG_API_SECRET }}
          BLOG_API_URL: ${{ secrets.BLOG_API_URL }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_publish || 'false' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PUBLISH_IMMEDIATELY: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

      - name: Commit log and LinkedIn queue
        run: |
          git config user.name "Blog Bot"
          git config user.email "bot@zoradevs.com"
          git add published_log.json linkedin_queue.txt used_unsplash_ids.json || true
          if git diff --staged --quiet; then
            echo "No log changes to commit"
          else
            git commit -m "Auto: scheduled blog + linkedin post [skip ci]"
            git push
          fi
