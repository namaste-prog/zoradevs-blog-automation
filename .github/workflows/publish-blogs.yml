name: Publish Daily Blog

on:
  schedule:
    # Mon–Fri 9:00 AM IST (3:30 AM UTC)
    - cron: "30 3 * * 1-5"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Force publish even if a blog was already logged today"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Generate and publish B2B blog
        run: node scripts/generate-and-publish.js
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
          BLOG_API_SECRET: ${{ secrets.BLOG_API_SECRET }}
          BLOG_API_URL: ${{ secrets.BLOG_API_URL }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_publish || 'false' }}

      - name: Commit log and LinkedIn queue
        run: |
          git config user.name "Blog Bot"
          git config user.email "bot@zoradevs.com"
          git add published_log.json linkedin_queue.txt used_unsplash_ids.json || true
          if git diff --staged --quiet; then
            echo "No log changes to commit"
          else
            git commit -m "Auto: published blog + linkedin post [skip ci]"
            git push
          fi
